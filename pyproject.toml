[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aireadi-preprocessing"
version = "0.3.0"
description = "Convert AI-READI source formats into tables for data science workflows"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3"]

[project.urls]
Repository = "https://github.com/billchen0/aireadi-preprocessing"
Issues = "https://github.com/billchen0/aireadi-preprocessing/issues"

[project.optional-dependencies]
notebook = ["jupyterlab>=4"]

[project.scripts]
aireadi-preprocess = "aireadi_preprocessing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
